name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate contribution visual
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: msaad-20007
        run: python scripts/generate_city.py

      - name: Commit changes only when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-city.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contribution visual" && git push)
